<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - StyleCart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f1ed;
        }

        .navbar {
            background-color: #3e2723;
            padding: 18px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #3e2723;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #3e2723;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #3e2723;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">StyleCart</a>
        <a href="/">Home</a>
        <a href="/product-page">Products</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </nav>

    <div class="container">

        <h1>Login</h1>

        <form action="/login" method="post">

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register here</a>
        </div>

    </div>

</body>

</html>
