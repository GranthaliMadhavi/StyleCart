<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title th:text="${product.name} + ' - StyleCart'">Product Details - StyleCart </title>
        <style>
            body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #230F03;
            padding: 18px 7%;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .navbar .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 80%;
            margin: 50px auto;
        }

        .product-details {
            display: flex;
            gap: 50px;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }

        .product-image {
            width: 45%;
        }

        .product-image img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-info {
            width: 55%;
        }

        .product-info h1 {
            font-size: 32px;
            margin-top: 0;
        }

        .category {
            color: #8b5e34;
            font-size: 18px;
        }

        .description {
            font-size: 17px;
            line-height: 1.6;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin: 25px 0;
        }

        .stock {
            font-size: 17px;
        }

        .btn {
            display: inline-block;
            background-color: #230F03;
            color: white;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #432818;
        }
        </style>
        
    </head>
    <body>
        <nav class="navbar">
            <a href="/" class="logo">StyleCart</a>
            <a href="/">Home</a>
            <a href="/products">Products</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </nav>
        <div class="container">
            <div class="product-details">
                 <div class="product-image">

            <img th:if="${product.image != null}"
                 th:src="${product.image}"
                 alt="Product Image">

        </div>
        <div class="product-info">
            <h1 th:text="${product.name}">Product Name</h1>
            <p class="category" th:text="${product.category}">Category</p>
            <p class="description" th:text="${product.description}">Product Description</p>
            <p class="price">$<span th:text="${product.price}">0</span></p>
            <p class="stock">Stock: <span th:text="${product.stock}">0</span></p>
            <a href="#" class="btn">Add to Cart</a>

        </div>
            </div>
        </div>
    </body>
</html>
