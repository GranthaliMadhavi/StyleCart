
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - StyleCart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .navbar {
            background: #3e2723;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #3e2723;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 13px;
            background: #3e2723;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #5d4037;
        }

        .hint {
            color: #666;
            font-size: 13px;
            margin-top: 6px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/vendor/dashboard" class="logo">StyleCart Vendor</a>
        <a href="/product-page">View Store</a>
    </nav>

    <div class="container">

        <h1>Add a Product</h1>
        <p>Enter your clothing details and choose the right audience.</p>

        <form action="/vendor/products/add" method="post"
      enctype="multipart/form-data">

            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" name="name"
                       placeholder="e.g. Blue Denim Jacket" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          placeholder="Describe your product" required></textarea>
            </div>

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number" id="price" name="price"
                       min="0.01" step="0.01"
                       placeholder="1499" required>
            </div>

            <div class="form-group">
                <label for="category">Clothing Category</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Jacket">Jacket</option>
                    <option value="Shirt">Shirt</option>
                    <option value="T-Shirt">T-Shirt</option>
                    <option value="Jeans">Jeans</option>
                    <option value="Dress">Dress</option>
                    <option value="Kurti">Kurti</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="targetAudience">Product For</label>
                <select id="targetAudience" name="targetAudience" required>
                    <option value="">Choose the audience</option>
                    <option value="MEN">Men</option>
                    <option value="WOMEN">Women</option>
                    <option value="KIDS">Kids</option>
                </select>
                <p class="hint">
                    This choice will determine which store section displays the product.
                </p>
            </div>

            <div class="form-group">
                <label for="stock">Available Stock</label>
                <input type="number" id="stock" name="stock"
                       min="0" step="1" placeholder="10" required>
            </div>

            
<div class="form-group">
    <label for="image">Product Image</label>

    <input type="file"
           id="image"
           name="image"
           accept="image/png, image/jpeg, image/webp"
           required>

    <p class="hint">
        Choose a product photo from your computer (JPG, PNG or WebP).
    </p>

    <img id="imagePreview"
         src="#"
         alt="Product image preview"
         style="display:none; width:180px; margin-top:12px;
                border-radius:8px; object-fit:cover;">
</div>


            

            <button type="submit" class="btn">Save Product</button>

        </form>

    </div>

    
    <script>
        const imageInput = document.getElementById("image");
        const imagePreview = document.getElementById("imagePreview");

        imageInput.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                imagePreview.src = URL.createObjectURL(file);
                imagePreview.style.display = "block";
            } else {
                imagePreview.style.display = "none";
                imagePreview.src = "#";
            }
        });
    </script>
</body>
</html>
