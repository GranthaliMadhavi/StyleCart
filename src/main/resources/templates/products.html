<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - StyleCart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
        }

        .navbar {
    padding: 18px 7%;
    background-color: #c19a5b;
}

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .navbar .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 85%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product-card {
            background: #694531;
            border: 1px solid #523828;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product-card h2 {
            margin: 15px 0 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .category {
            color: #ffe6a7;
        }

        .btn {
            display: inline-block;
            background-color: #111213;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        .empty {
            text-align: center;
            font-size: 18px;
            color: #777;
        }
    </style>
</head>

<body>

<nav class="navbar">

    <a href="/" class="logo">StyleCart</a>

    <a href="/">Home</a>

    <a href="/products">Products</a>

    <a href="#">Men</a>

    <a href="#">Women</a>

    <a href="#">Kids</a>

    <a href="#">Login</a>

    <a href="#">Register</a>

</nav>


<div class="container">

    <h1>Our Products</h1>

    <div class="products" th:if="${not #lists.isEmpty(products)}">

        <div class="product-card" th:each="product : ${products}">

            <img th:if="${product.image != null}"
                th:src="@{/images/{image}(image=${product.image})}"
                alt="Product Image">
            <h2 th:text="${product.name}">Product Name</h2>

            <p class="category"
               th:text="${product.category}">
                Category
            </p>

            <p th:text="${product.description}">
                Product description
            </p>

            <p class="price">
                ₹<span th:text="${product.price}">0</span>
            </p>

            <p>
                Stock:
                <span th:text="${product.stock}">0</span>
            </p>

            <a href="#" class="btn">View Product</a>

        </div>

    </div>


    <div class="empty" th:if="${#lists.isEmpty(products)}">

        <p>No products available yet.</p>

    </div>

</div>

</body>
</html>
